[package]
name = "rdevops"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
futures = "=0.3.34"
reqwest = { version = "=0.13.5", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_yaml = "=0.9.34"
tokio = { version = "=1.54.1", features = ["full"] }
toml = "=1.2.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
