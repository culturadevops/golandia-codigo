# El MISMO backend para todos: nginx 1.30.6 con 4 CPU (que no sea el cuello de botella).
worker_processes 4;
events { worker_connections 8192; }
http {
    access_log off;
    keepalive_requests 100000;
    server {
        listen 80;
        location = /chico { default_type text/plain; return 200 "hola desde el backend del banco gl-gra: 64 bytes de respuesta.\n"; }
        location /grande { root /srv; }
        location = /estado { stub_status; }   # peticiones atendidas: ¿llegó todo al backend?
    }
}
