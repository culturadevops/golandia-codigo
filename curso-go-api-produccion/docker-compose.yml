# Todo en local: docker compose up --build
# Postgres (con los dos usuarios), las migraciones como paso aparte, y la API en :8080.
name: tareas

services:
  bd:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: postgres      # solo para desarrollo
    volumes:
      - ./sql/roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
      - datos:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # -h 127.0.0.1: durante la inicialización Postgres solo escucha por socket, y un
      # pg_isready sin -h diría «listo» antes de que existan los usuarios.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "tareas"]
      interval: 2s
      retries: 30

  migrar:
    build: .
    command: ["migrar"]
    environment:
      BD_URL_MIGRAR: postgres://migrador:migrador@bd:5432/tareas?sslmode=disable
    healthcheck:
      disable: true
    depends_on:
      bd:
        condition: service_healthy

  api:
    build: .
    environment:
      PUERTO: "8080"
      BD_URL: postgres://app:app@bd:5432/tareas?sslmode=disable
      DRENAJE: 2s
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrar:
        condition: service_completed_successfully

volumes:
  datos: {}
