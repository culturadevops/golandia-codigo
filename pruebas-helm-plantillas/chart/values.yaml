replicas: 2
imagen:
  repo: nginx
  tag: "1.30.5-alpine"
montarToken: false
puertos:
  - nombre: http
    puerto: 80
  - nombre: metricas
    puerto: 9090
env:
  PUERTO: 8080
  DEBUG: true
  VERSION: "1.10"
dbHost: "{{ .Release.Name }}-db.{{ .Release.Namespace }}.svc"
recursos:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
