apiVersion: apps/v1
kind: Deployment
metadata:
  name: default
spec:
  replicas: {{ .Values.replicas | default 3 }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: {{ .Values.montarToken | default true }}
      containers:
        - name: web
          image: nginx:1.30.5-alpine
