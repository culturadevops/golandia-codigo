# A · logs JSON: leer el archivo desde el principio → quitar nivel=debug → añadir entorno=prod → renombrar ms → JSON a archivo
[agent]
  interval = "1s"
  flush_interval = "1s"
  metric_batch_size = 10000
  metric_buffer_limit = 1000000
  omit_hostname = true
  quiet = true

[[inputs.tail]]
  files = ["/datos/eventos.json"]
  initial_read_offset = "beginning"
  ## por defecto 1000: con eso la salida espera al flush de cada segundo (≈1.000 líneas/s). La doc pide subirlo por encima del lote.
  max_undelivered_lines = 20000
  name_override = "log"
  data_format = "json"
  tag_keys = ["nivel", "servicio"]
  json_string_fields = ["ruta"]
  json_time_key = "ts"
  json_time_format = "2006-01-02T15:04:05Z07:00"
  [inputs.tail.tagdrop]
    nivel = ["debug"]

[[processors.rename]]
  [[processors.rename.replace]]
    field = "ms"
    dest = "duracion_ms"

[[processors.override]]
  [processors.override.tags]
    entorno = "prod"

[[outputs.file]]
  files = ["/salida/out.json"]
  data_format = "json"
