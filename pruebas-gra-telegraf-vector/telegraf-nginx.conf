# B · log de acceso de nginx en texto: leer → separar los campos (grok) → JSON a archivo
[agent]
  interval = "1s"
  flush_interval = "1s"
  metric_batch_size = 10000
  metric_buffer_limit = 1000000
  omit_hostname = true
  quiet = true

[[inputs.tail]]
  files = ["/datos/access.log"]
  initial_read_offset = "beginning"
  ## por defecto 1000: con eso la salida espera al flush de cada segundo (≈1.000 líneas/s). La doc pide subirlo por encima del lote.
  max_undelivered_lines = 20000
  name_override = "acceso"
  data_format = "grok"
  grok_patterns = ["%{COMBINED_LOG_FORMAT}"]

[[outputs.file]]
  files = ["/salida/out.json"]
  data_format = "json"
