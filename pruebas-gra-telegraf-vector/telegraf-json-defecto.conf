# A con los valores POR DEFECTO de inputs.tail (max_undelivered_lines = 1000): la trampa
[agent]
  interval = "1s"
  flush_interval = "1s"
  metric_batch_size = 10000
  metric_buffer_limit = 1000000
  omit_hostname = true
  quiet = true

[[inputs.tail]]
  files = ["/datos/eventos.json"]
  initial_read_offset = "beginning"
  name_override = "log"
  data_format = "json"
  tag_keys = ["nivel", "servicio"]
  json_string_fields = ["ruta"]
  json_time_key = "ts"
  json_time_format = "2006-01-02T15:04:05Z07:00"
  [inputs.tail.tagdrop]
    nivel = ["debug"]

[[processors.rename]]
  [[processors.rename.replace]]
    field = "ms"
    dest = "duracion_ms"

[[processors.override]]
  [processors.override.tags]
    entorno = "prod"

[[outputs.file]]
  files = ["/salida/out.json"]
  data_format = "json"
