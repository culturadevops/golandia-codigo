<!doctype html><html lang="es"><meta charset="utf-8"><title>Lección 5</title>
<style>body{font:20px ui-monospace,monospace;background:#0d1117;color:#e6edf3;padding:30px}</style>
<body><h2 style="font-family:system-ui;color:#00ADD8">El contexto</h2><p id="a"></p><p id="b"></p>
<script>
window.onload = async () => {
  const A = window.go.main.App
  let r = await A.Titulo(true);  document.getElementById('a').innerText = 'el ctx de OnStartup: ' + r; await A.Reportar('  con el ctx de OnStartup:  ' + r)
  document.getElementById('b').innerText = 'en 4 s: el mismo método con context.Background()…'
  await A.Reportar('  ahora, con context.Background():')
  setTimeout(() => A.Titulo(false), 4000)
}
</script></body></html>
